<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS2 Optimizer - Панель Управления Лицензиями</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0f19;
            --card: #151d30;
            --border: #23314e;
            --accent: #00d2ff;
            --accent-glow: rgba(0, 210, 255, 0.35);
            --success: #10b981;
            --danger: #ef4444;
            --text: #f1f5f9;
            --muted: #8492a6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 30px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 820px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .header {
            text-align: center;
            padding: 20px 0 10px;
        }
        .header h1 {
            font-family: 'JetBrains Mono', monospace;
            font-size: 28px;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 20px var(--accent-glow);
        }
        .header p {
            color: var(--muted);
            margin-top: 6px;
            font-size: 14px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 6px;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 12px 14px;
            background: #0d1322;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: #fff;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }
        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #00d2ff, #0077ff);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px var(--accent-glow);
        }
        .btn-danger {
            background: var(--danger);
            padding: 6px 12px;
            font-size: 12px;
            width: auto;
            border-radius: 6px;
        }
        .btn-danger:hover {
            background: #dc2626;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.4);
            transform: none;
        }
        .btn-secondary {
            background: #1e293b;
            border: 1px solid var(--border);
            color: var(--muted);
            font-size: 13px;
            padding: 8px 16px;
            width: auto;
        }
        .btn-secondary:hover {
            background: #27354f;
            color: #fff;
            box-shadow: none;
            transform: none;
        }

        .alert-box {
            display: none;
            margin-top: 18px;
            padding: 16px;
            border-radius: 8px;
            background: #0b1f1a;
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #34d399;
            font-size: 14px;
        }
        .alert-box.active { display: block; }
        .key-result {
            margin-top: 10px;
            background: #06111a;
            padding: 12px;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 18px;
            color: var(--accent);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px dashed var(--accent);
        }
        .copy-btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 6px 14px;
            border-radius: 5px;
            font-weight: 700;
            cursor: pointer;
            font-size: 12px;
        }
        .copy-btn:hover { background: #fff; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
        }
        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
        }
        th {
            color: var(--muted);
            font-weight: 500;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 1px;
        }
        td code {
            font-family: 'JetBrains Mono', monospace;
            color: var(--accent);
            background: rgba(0, 210, 255, 0.08);
            padding: 3px 6px;
            border-radius: 4px;
        }
        .status-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
        }

        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        @media (max-width: 600px) {
            .settings-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>CS2 PRO LICENSE MANAGER</h1>
        <p>Панель управления доступом и генерации HWID-ключей</p>
    </div>

    <!-- Настройки подключения -->
    <div class="card">
        <div class="card-title">⚙️ Подключение к GitHub API</div>
        <div class="settings-grid">
            <div class="form-group">
                <label>GitHub Personal Token (с правами repo):</label>
                <input type="password" id="ghToken" placeholder="ghp_...">
            </div>
            <div class="form-group">
                <label>Репозиторий (username/repo):</label>
                <input type="text" id="ghRepo" value="sever-xd/cs2-optimizer">
            </div>
        </div>
        <div style="display:flex; justify-content: flex-end;">
            <button class="btn btn-secondary" onclick="saveSettings()">Сохранить настройки</button>
        </div>
    </div>

    <!-- Генерация ключа -->
    <div class="card">
        <div class="card-title">🔑 Выдача нового ключа покупателю (FunPay)</div>
        <div class="form-group">
            <label>HWID покупателя (полученный из окна программы):</label>
            <input type="text" id="clientHwid" placeholder="Например: 4C4C4544-0050-4E10-8043-B5C04F343832">
        </div>
        <button class="btn" id="genBtn" onclick="createLicense()">⚡ Сгенерировать ключ и активировать</button>

        <div class="alert-box" id="resultBox">
            <div>Лицензия успешно создана и сохранена в базу! Отправьте покупателю:</div>
            <div class="key-result">
                <span id="createdKeyText">CS2-XXXX-XXXX-XXXX</span>
                <button class="copy-btn" onclick="copyKey()">Скопировать</button>
            </div>
        </div>
    </div>

    <!-- Список активных лицензий -->
    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 12px;">
            <div class="card-title" style="border:none; margin:0; padding:0;">📋 Активные лицензии</div>
            <button class="btn btn-secondary" onclick="loadLicenses()">🔄 Обновить</button>
        </div>
        
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>HWID ПК</th>
                        <th>Ключ</th>
                        <th>Статус</th>
                        <th>Действие</th>
                    </tr>
                </thead>
                <tbody id="licensesTableBody">
                    <tr><td colspan="4" style="text-align: center; color: var(--muted);">Загрузка...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const DEFAULT_REPO = 'sever-xd/cs2-optimizer';

    function init() {
        const savedToken = localStorage.getItem('cs2_gh_token') || '';
        const savedRepo = localStorage.getItem('cs2_gh_repo') || DEFAULT_REPO;

        document.getElementById('ghToken').value = savedToken;
        document.getElementById('ghRepo').value = savedRepo;

        if (savedToken) {
            loadLicenses();
        } else {
            document.getElementById('licensesTableBody').innerHTML = '<tr><td colspan="4" style="text-align: center; color: #ef4444;">Введите GitHub Токен в настройках выше и нажмите "Сохранить"</td></tr>';
        }
    }

    function saveSettings() {
        const token = document.getElementById('ghToken').value.trim();
        const repo = document.getElementById('ghRepo').value.trim() || DEFAULT_REPO;
        localStorage.setItem('cs2_gh_token', token);
        localStorage.setItem('cs2_gh_repo', repo);
        alert('Настройки сохранены!');
        loadLicenses();
    }

    function generateKey() {
        const seg = () => Math.random().toString(36).substring(2, 6).toUpperCase();
        return `CS2-${seg()}-${seg()}-${seg()}`;
    }

    function copyKey() {
        const key = document.getElementById('createdKeyText').innerText;
        navigator.clipboard.writeText(key);
        alert('Ключ скопирован в буфер обмена!');
    }

    async function fetchFile() {
        const token = localStorage.getItem('cs2_gh_token');
        const repo = localStorage.getItem('cs2_gh_repo') || DEFAULT_REPO;

        if (!token) throw new Error('GitHub Токен не указан!');

        const res = await fetch(`https://api.github.com/repos/${repo}/contents/licenses.json`, {
            headers: {
                'Authorization': `Bearer ${token}`,
                'Accept': 'application/vnd.github.v3+json'
            }
        });

        if (!res.ok) throw new Error(`Не удалось загрузить licenses.json: ${res.statusText}`);
        return await res.json();
    }

    async function loadLicenses() {
        const tbody = document.getElementById('licensesTableBody');
        tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: var(--muted);">Загрузка из базы...</td></tr>';

        try {
            const fileData = await fetchFile();
            const decoded = decodeURIComponent(escape(atob(fileData.content)));
            const licenses = JSON.parse(decoded);

            tbody.innerHTML = '';
            const hwids = Object.keys(licenses);

            if (hwids.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: var(--muted);">База пуста</td></tr>';
                return;
            }

            hwids.forEach(hwid => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><code>${hwid}</code></td>
                    <td><code>${licenses[hwid]}</code></td>
                    <td><span class="status-badge">Активен</span></td>
                    <td><button class="btn btn-danger" onclick="revokeLicense('${hwid}')">Отозвать</button></td>
                `;
                tbody.appendChild(tr);
            });
        } catch (e) {
            tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: var(--danger);">${e.message}</td></tr>`;
        }
    }

    async function createLicense() {
        const hwid = document.getElementById('clientHwid').value.trim();
        const token = localStorage.getItem('cs2_gh_token');
        const repo = localStorage.getItem('cs2_gh_repo') || DEFAULT_REPO;
        const btn = document.getElementById('genBtn');

        if (!hwid) {
            alert('Пожалуйста, введите HWID покупателя!');
            return;
        }
        if (!token) {
            alert('Сначала укажите GitHub Token в настройках!');
            return;
        }

        btn.disabled = true;
        btn.innerText = 'Сохранение в базу...';

        try {
            const fileData = await fetchFile();
            const decoded = decodeURIComponent(escape(atob(fileData.content)));
            let licenses = JSON.parse(decoded);

            const newKey = generateKey();
            licenses[hwid] = newKey;

            const updatedContent = btoa(unescape(encodeURIComponent(JSON.stringify(licenses, null, 2))));

            const res = await fetch(`https://api.github.com/repos/${repo}/contents/licenses.json`, {
                method: 'PUT',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: `Лицензия для ${hwid}`,
                    content: updatedContent,
                    sha: fileData.sha
                })
            });

            if (!res.ok) throw new Error('Ошибка записи в GitHub репозиторий');

            document.getElementById('createdKeyText').innerText = newKey;
            document.getElementById('resultBox').classList.add('active');
            document.getElementById('clientHwid').value = '';
            loadLicenses();
        } catch (e) {
            alert('Ошибка: ' + e.message);
        } finally {
            btn.disabled = false;
            btn.innerText = '⚡ Сгенерировать ключ и активировать';
        }
    }

    async function revokeLicense(targetHwid) {
        if (!confirm(`Вы действительно хотите отозвать лицензию для ${targetHwid}? Клиент больше не сможет запустить оптимизатор.`)) {
            return;
        }

        const token = localStorage.getItem('cs2_gh_token');
        const repo = localStorage.getItem('cs2_gh_repo') || DEFAULT_REPO;

        try {
            const fileData = await fetchFile();
            const decoded = decodeURIComponent(escape(atob(fileData.content)));
            let licenses = JSON.parse(decoded);

            delete licenses[targetHwid];

            const updatedContent = btoa(unescape(encodeURIComponent(JSON.stringify(licenses, null, 2))));

            const res = await fetch(`https://api.github.com/repos/${repo}/contents/licenses.json`, {
                method: 'PUT',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: `Отозвана лицензия для ${targetHwid}`,
                    content: updatedContent,
                    sha: fileData.sha
                })
            });

            if (res.ok) {
                alert('Лицензия отозвана!');
                loadLicenses();
            } else {
                throw new Error('Ошибка удаления лицензии');
            }
        } catch (e) {
            alert('Ошибка: ' + e.message);
        }
    }

    window.onload = init;
</script>

</body>
</html>
